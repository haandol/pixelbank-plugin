name: Verify plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the project verification image
        run: docker build --tag pixelbank-plugin-check .devcontainer
      - name: Verify the workspace and installation package
        run: >-
          docker run --rm --init --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/workspaces/pixelbank-plugin"
          --env BUN_INSTALL_CACHE_DIR=/tmp/bun-cache
          pixelbank-plugin-check sh -c
          'test -z "$(command -v node)" && bun install --frozen-lockfile --ignore-scripts && bun run check && git diff --exit-code -- plugins/pixelbank/dist bun.lock'
